<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Main Ahrefs popup (shown after login) -->
  <div id="ah_p" style="min-width: 720px; display: none;"></div>

  <!-- Login Screen (shown before login) -->
  <div id="login-container" style="display: none; min-width: 400px; min-height: 340px; padding: 0; background: #0d0f1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div style="background: linear-gradient(135deg, #0d0f1a 0%, #1c1f35 100%); min-height: 340px; display: flex; flex-direction: column; justify-content: center; padding: 32px;">
      
      <!-- Logo -->
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.5px;">
          Tool<span style="color: #f97316;">Waly</span>
        </div>
        <div style="font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px;">Proxy Bar (Secure Edition)</div>
      </div>

      <!-- Error / Info message -->
      <div id="login-message" style="display: none; padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-bottom: 16px; text-align: center;"></div>

      <!-- Login Form -->
      <div id="login-form-wrap">
        <div style="margin-bottom: 14px;">
          <div style="font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px;">Username</div>
          <input id="login-username" type="text" placeholder="Enter your username"
            style="width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: #fff; outline: none; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 20px;">
          <div style="font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px;">Password</div>
          <input id="login-password" type="password" placeholder="Enter your password"
            style="width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: #fff; outline: none; box-sizing: border-box;">
        </div>
        <button id="login-btn"
          style="width: 100%; background: linear-gradient(135deg, #f97316, #ea580c); border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; transition: opacity .2s;">
          Login &amp; Sync
        </button>
      </div>

      <!-- Loading State -->
      <div id="login-loading" style="display: none; text-align: center; color: rgba(255,255,255,0.5); font-size: 13px;">
        <div id="loading-text">Authenticating...</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
  <!-- ToolsMandi Login & Proxy Sync System -->
  <script src="mandi_login.js"></script>
  <!-- UI Customizations -->
  <script src="custom.js"></script>

</body>
</html>
